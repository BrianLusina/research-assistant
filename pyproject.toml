[project]
name = "research-assistant"
version = "0.1.0"
description = "AI powered research assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "crewai>=1.15.40",
    "dotenv>=0.9.9",
    "langchain>=1.5.2",
    "langchain-openai>=1.8.5",
    "openai>=2.53.0",
    "reportlab>=5.1.0",
    "requests>=2.34.2",
    "streamlit>=1.67.0",
]

[dependency-groups]
lint = [
    "pyrefly>=1.4.1",
    "ruff>=0.17.4",
]
