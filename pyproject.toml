[project]
name = "research-assistant"
version = "0.1.0"
description = "AI powered research assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "crewai>=1.15.17",
    "dotenv>=0.9.9",
    "langchain>=1.3.17",
    "langchain-openai>=1.6.0",
    "openai>=2.53.0",
    "reportlab>=5.0.1",
    "requests>=2.34.2",
    "streamlit>=1.62.0",
]

[dependency-groups]
lint = [
    "pyrefly>=1.2.0",
    "ruff>=0.16.3",
]
