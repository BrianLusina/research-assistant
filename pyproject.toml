version = "0.1.0"
description = "AI powered research assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "crewai>=1.15.28",
    "dotenv>=0.9.9",
    "langchain>=1.4.7",
    "langchain-openai>=1.7.2",
    "openai>=2.53.0",
